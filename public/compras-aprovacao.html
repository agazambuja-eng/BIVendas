<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aprovação · Controle de Solicitações de Compras</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="/css/acesso.css">
</head>
<body class="acesso-pagina">
  <header class="acesso-topo so-logado">
    <h1>Controle de Solicitações de Compras<span>aprovação e acompanhamento</span></h1>
    <nav class="barra-usuario" id="barraUsuario"></nav>
  </header>
  <nav class="submenu-config cp-largo so-logado" id="submenuCompras"></nav>

  <main class="acesso-conteudo cp-largo so-logado">
    <div id="contadores" class="cp-contadores"></div>
    <div id="msgAprovacao" class="acesso-msg"></div>

    <div class="cp-dupla">
      <section class="cp-coluna-lista">
        <div class="cp-filtros-linha">
          <label class="cp-oculto" for="fStatus">Situação</label>
          <select id="fStatus" onchange="renderizarLista()">
            <option value="aguardando">Aguardando aprovação</option>
            <option value="aprovado">Aprovados · compra a fazer</option>
            <option value="comprado">Compra solicitada</option>
            <option value="entregue">Entregues</option>
            <option value="reprovado">Reprovados</option>
            <option value="cancelado">Cancelados</option>
            <option value="">Todas as situações</option>
          </select>
          <label class="cp-oculto" for="fLoja">Loja</label>
          <select id="fLoja" onchange="renderizarLista()"><option value="">Todas as lojas</option></select>
          <label class="cp-oculto" for="fBusca">Buscar</label>
          <input type="search" id="fBusca" placeholder="Nº do pedido ou nome" oninput="renderizarLista()">
        </div>
        <div id="listaPedidos" class="cp-lista-aprov"></div>
      </section>

      <section class="cp-coluna-detalhe cp-card" id="painelDetalhe">
        <p class="acesso-ajuda">Escolha um pedido na lista.</p>
      </section>
    </div>
  </main>

  <script src="/js/supabase-config.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/compras-comum.js"></script>
  <script src="/js/compras-aprovacao.js"></script>
</body>
</html>
